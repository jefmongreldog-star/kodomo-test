<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--sub:#667085;--pri:#3b5bdb;--ok:#2b8a3e;--okbg:#e6f4ea;--ng:#d6336c;--ngbg:#fdebf2;--bd:#e3e6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1e222b;--tx:#eceef3;--sub:#9aa3b2;--pri:#748ffc;--ok:#69db7c;--okbg:#1d3326;--ng:#f783ac;--ngbg:#3a1f2b;--bd:#2c3240}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1e222b;--tx:#eceef3;--sub:#9aa3b2;--pri:#748ffc;--ok:#69db7c;--okbg:#1d3326;--ng:#f783ac;--ngbg:#3a1f2b;--bd:#2c3240}

body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Meiryo",system-ui,sans-serif;line-height:1.7}

h1{font-size:1.25rem;margin:8px 0 4px}.sub{color:var(--sub);font-size:.9rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-align:left;margin-bottom:8px}

.btn.p{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:700}
.btn.p:disabled{opacity:.4}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.82rem}
.q{font-size:1.08rem;margin:10px 0 18px}
.ans{display:flex;gap:12px}.ans button{flex:1;font-size:2rem;padding:16px 0;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.ans button.o:hover{border-color:var(--ok)}.ans button.x:hover{border-color:var(--ng)}

.score{font-size:2.6rem;font-weight:800;text-align:center;margin:4px 0}

<script>
const Q=[{"n":1,"q":"こども性暴力防止法が対象とするこどもへの性暴力とは、不同意性交やわいせつな言動などであるが、盗撮は含まれない。","s":"こども性暴力防止法の概要","a":"×","e":"こども性暴力防止法が対象とするこどもへの性暴力とは、不同意性交に加え、わいせつな言動、盗撮などを指す。"},{"n":2,"q":"「不適切な行為」とは、行為そのものは性暴力には該当しなくとも、業務上必要な行為と言えず、その行為が継続・発展することにより性暴力につながる可能性のある行為をいい、すべての事業・業務において統一的な判断基準がある。","s":"こども性暴力防止法の概要","a":"×","e":"「不適切な行為」とは、行為そのものは性暴力には該当しなくとも、業務上必要な行為と言えず、その行為が継続・発展することにより性暴力につながる可能性のある行為を言う。どのような行為が「不適切な行為」に該当するかは、事業内容やこどもの特性などによって異なる。"},{"n":3,"q":"加害者側には、『少し触っただけで大したことではない』『こどもは嫌がっていなかった』という一方的な思い込みが見られることがある。これを「認知の偏り」と言う。","s":"こども性暴力防止法の概要","a":"○","e":""},{"n":4,"q":"学校や認可保育所、認定こども園などを設置する事業者を「学校設置者等」といい、公立の事業者のみ法の対象となり、私立の事業者は対象外である。また、放課後児童クラブや学習塾など、義務対象以外でこどもに教育・保育などを提供する民間の事業者は、法の対象とはならない。","s":"こども性暴力防止法の概要","a":"×","e":"学校や認可保育所、認定こども園などを設置する事業者を「学校設置者等」といい、公立、私立を問わず全ての事業者が法の対象となる。また、放課後児童クラブや学習塾など、義務対象以外でこどもに教育・保育などを提供する事業者を「民間教育保育等事業者」といい、こども家庭庁に申請し認められた場合に法の対象となる。"},{"n":5,"q":"法の対象となった事業者には「安全確保措置」と「情報管理措置」に取り組むことが求められる。","s":"こども性暴力防止法の概要","a":"○","e":""},{"n":6,"q":"こどもの安全を守るために事業者が行う必要がある「安全確保措置」には、未然防止のためのルールの整備や従事者への研修の実施、早期発見のための相談窓口の設置や、性暴力が疑われる際の調査、被害にあったこどもの保護・支援などが含まれる。","s":"こども性暴力防止法の概要","a":"○","e":""},{"n":7,"q":"不同意性交、不同意わいせつ、児童買春、児童ポルノ所持、盗撮といった特定性犯罪は、大人に対して行われた場合は、犯罪事実確認の対象にならない。","s":"こども性暴力防止法の概要","a":"×","e":"犯罪事実確認の対象となる「特定性犯罪」とは、不同意性交、不同意わいせつ、児童買春、児童ポルノ所持、盗撮などのこども性暴力防止法で定める一般的な性犯罪を指し、これらの犯罪が大人に対して行われた場合も、犯罪事実確認の対象になる。"},{"n":8,"q":"被害者の側から見たこどもへの性暴力の特性として「深刻さ」、「相談のしづらさ」、「発見のしづらさ」がある。","s":"性暴力発生防止に関する基礎","a":"○","e":""},{"n":9,"q":"こどもは、話しても大丈夫という安心感がないと、被害を打ち明けることができないことがある。そのため、被害を打ち明ける前に、保護者や友人、先生やコーチなどの身近な大人に対し、誰が批判をせずに受け止めてくれるかを、日常の会話の中で探ることがある。","s":"性暴力発生防止に関する基礎","a":"○","e":""},{"n":10,"q":"性暴力の加害者には、「少し触っただけだ」、「実はこどもも喜んでいる」「これだけ頑張っているから見返りを求めてもよいはずだ」などのいわゆる「思考の誤り」「認知の偏り」と呼ばれる一方的な思い込みや、自己中心的な考えが見られる。","s":"性暴力発生防止に関する基礎","a":"○","e":""},{"n":11,"q":"性暴力の加害者は、こどもを手なずけ、信頼関係を醸成し、こどもの心情や行動を操作して性暴力に及ぶことがある。これを「性的グルーミング」と呼ぶ。","s":"性暴力発生防止に関する基礎","a":"○","e":""},{"n":12,"q":"環境面から見た性暴力の特性として、①指導などを通じて支配的・優越的立場に立つ「支配性」、②業務の中で繰り返しこどもと接する「継続性」、③保護者などの目が届かない「閉鎖性」がある。教育・保育などの場では、支配性、継続性、閉鎖性のある環境は成立しにくいが、「性暴力はどこでも起こり得るものだ」との意識を持って、未然防止や早期把握に努める必要がある。","s":"性暴力発生防止に関する基礎","a":"×","e":"環境面から見た性暴力の特性として、①指導などを通じて強い立場に立つ「支配性」、②業務の中で繰り返しこどもと接する「継続性」、③保護者などの目が届かない「閉鎖性」がある。教育・保育などの場では、支配性、継続性、閉鎖性のある環境が成立しやすいため、「性暴力はどこでも起こり得るものだ」との意識を持って、未然防止や早期把握に努める必要がある。"},{"n":13,"q":"すべてのこどもは生まれながらに権利を持っている。こどもの権利条約では、①差別がないこと、②命を守られ成長できること、③こどもにとって最もよいこと、④意見を表明し参加できること、の４つを基本原則として定めている。","s":"性暴力発生防止に関する基礎","a":"○","e":""},{"n":14,"q":"こどもが望んだと主張して性暴力を正当化することは、こどもの意見を尊重することにも、こどもの権利を守ることにもならない。こどもには、性的行為に適切に同意する能力が十分に備わっているとは言えないことを理解する必要がある。","s":"性暴力発生防止に関する基礎","a":"○","e":""},{"n":15,"q":"こども性暴力防止法の対象となるこどもへの性暴力とは、不同意性交やわいせつな言動などを指すが、盗撮は含まれない。","s":"性暴力発生防止に関する基礎","a":"×","e":"こども性暴力防止法の対象となるこどもへの性暴力とは、不同意性交に加え、わいせつな言動、盗撮などを指す。"},{"n":16,"q":"「不適切な行為」とは、行為そのものは性暴力には該当しなくとも、業務上必要な行為と言えず、その行為が継続・発展することにより性暴力につながる可能性のある行為をいい、すべての事業・業務において統一的な判断基準がある。","s":"性暴力発生防止に関する基礎","a":"×","e":"「不適切な行為」とは、行為そのものは性暴力には該当しなくとも、業務上必要な行為と言えず、その行為が継続・発展することにより性暴力につながる可能性のある行為を言う。どのような行為が「不適切な行為」に該当するかは、事業内容やこどもの特性などによって異なる。"},{"n":17,"q":"不適切な行為は事業内容やこどもの特性などによって異なるため、どういった行為がそれぞれの事業に照らして不適切な行為に当たるのかについて、従事者とよくコミュニケーションをとりながら、過度な委縮につながらないようにルール設定をすることが重要である。また、事業者内で定めた不適切な行為について、従事者には周知する必要があるが、こどもや保護者に対しての周知は不要である。","s":"性暴力発生防止に関する基礎","a":"×","e":"不適切な行為は事業内容やこどもの特性などによって異なるため、どういった行為がそれぞれの事業に照らして不適切な行為に当たるのかについて、従事者とよくコミュニケーションをとりながら、過度な委縮につながらないようにルール設定をすることが重要である。また、事業者内で定めた不適切な行為について、従事者だけでなく、こどもや保護者に対しても周知を行う必要がある。"},{"n":18,"q":"こども性暴力防止法における安全確保措置とは、性暴力を未然に防止し、性暴力が発生した場合は早期に発見するとともに、事実関係の調査を行い、被害にあったこどもの保護・支援や、更なる性暴力の防止につなげる取組を言う。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":19,"q":"性暴力の未然防止の取組としては、服務規律などの整備・周知、施設・事業所環境の整備、従事者への研修などがあり、早期発見の取組としては、日常観察、面談・アンケート、相談体制の整備などがある。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":20,"q":"性暴力の訴えがあった場合や、「最近様子がおかしい」といった気付きがある場合は、あらかじめ決められたルールに則って、迅速に報告・共有し、対応する。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":21,"q":"性暴力の被害にあったこどもには、心身にさまざまな反応が見られる場合があり、日頃から、こどもの心身・行動に変化がないかを観察し、小さな変化やSOS 信号を見逃さないことが重要であるが、日常的な観察は、事業者の義務ではない。","s":"安全確保措置１．早期発見のための取組","a":"×","e":"性暴力の被害にあったこどもには、心身にさまざまな反応が見られる場合があり、日頃から、こどもの心身・行動に変化がないかを観察する中で、小さな変化や SOS 信号を見逃さないことが重要である。このため、こども性暴力防止法では、事業者に、こどもに対して日常的な観察を行うことを義務付けている。"},{"n":22,"q":"日常的な観察において気を付けるべきこどもの変化には、「からだの変化」として、腹痛や頭痛、不眠など、「こころの変化」として、元気がない、情緒不安定、落ち着きのなさなど、「行動の変化」として、人と接したがらない、人との距離が過度に近い、反抗的になる、自傷行為、他人への攻撃的な言動などがある。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":23,"q":"こどもの変化に気付いたときは、こども本人に「最近どう？」「元気がないみたいだけど」「ちょっとイライラしているように見えるけど」といった声掛けをして対話につなげる。被害にあったこどもは、自らの相談を批判せずに受け止めてくれるかを会話の中で探る場合がある。すぐには被害を打ち明けられないことも多いため、継続的な対応を行うことが有効である。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":24,"q":"こどもとの対話の際、「誰かから嫌なことされてない？」「触られたりしなかった？」「◯◯先生のこと、どう思う？」などと具体的な内容を含む質問をするとよい。","s":"安全確保措置１．早期発見のための取組","a":"×","e":"こどもとの対話の際、「誰かから嫌なことされてない？」「触られたりしなかった？」「◯◯先生のこと、どう思う？」などと具体的な内容を含む問いは、暗示や誘導となってしまう可能性があるため、聞かない。"},{"n":25,"q":"こどもに面談・アンケートを行い、能動的に性暴力の早期発見につなげることが有効であるが、面談やアンケートの実施は事業者の義務ではない。","s":"安全確保措置１．早期発見のための取組","a":"×","e":"こどもに面談・アンケートを行い、能動的に性暴力の早期発見につなげることが有効であり、こども性暴力防止法では、事業者に面談またはアンケートの実施を義務付けている。"},{"n":26,"q":"こどもや保護者が性暴力の被害や悩みを相談しやすい工夫をすることは重要であり、こども性暴力防止法では、事業者に対して、相談窓口を設置することや、その周知をすることを義務付けている。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":27,"q":"従事者によるこどもへの性暴力や、不適切な行為の疑いなどを認識した際には、直ちに報告し、組織的な対応につなげることが重要である。自分一人で抱え込むことなく、事業者のルールに則って適切に報告する。","s":"安全確保措置１．早期発見のための取組","a":"○","e":""},{"n":28,"q":"こども性暴力防止法では、事業者に対し、報告ルールの設定と報告後の対応ルールの設定を義務付けているが、対応チームに所属していない従事者は、職場において、どのようなルールとなっているか日頃から確認しておく必要はない。","s":"安全確保措置１．早期発見のための取組","a":"×","e":"こども性暴力防止法では、事業者に対し、報告ルールの設定と報告後の対応ルールの設定を義務付けているので、職場において、どのようなルールとなっているか日頃から確認しておく。"},{"n":29,"q":"こどもから被害について打ち明けられたら、まずは安心できる場所を確保し、可能であれば、録音の用意や筆記役の同席など、記録をとる準備を行う。","s":"安全確保措置２．初期対応","a":"○","e":""},{"n":30,"q":"はじめに被害を打ち明けられた時の聴き取りでは、聴き取る内容は最小限にして、こどもが自発的に打ち明けた内容だけ聴き取り、それ以上はこちらから尋ねない。聞き取る内容は、「誰が」「何をした」だけでなく「なぜ」「いつ」「何回」を聴き取る。","s":"安全確保措置２．初期対応","a":"×","e":"はじめに被害を打ち明けられた時の聴き取りでは、聴き取る内容は最小限にして、こどもが自発的に打ち明けた内容だけ聴き取り、それ以上はこちらから尋ねない。「誰が」「何をした」かが分かれば十分であり、「なぜ」「いつ」「何回」はこどもにとって答えるのが難しいためこちらから尋ねることは避ける。"},{"n":31,"q":"被害にあったこどもに、何度も話を聴いたり、誘導するような質問をしたりすると、質問に含まれる情報やあとから聞いた情報を、自分の考えや体験と思い込んでしまうことがある。このようにして本来の体験の記憶が変わってしまうことを「記憶の汚染」と言う。記憶の汚染は、記憶能力が発達段階にある幼少期などにおいて生じやすいとされているが、年齢が高くても、状況によっては記憶があいまいになり、記憶が変わってしまう場合もある。","s":"安全確保措置２．初期対応","a":"○","e":""},{"n":32,"q":"被害について聴き取るときに、こどもが話していないのに「〇〇先生がやったの？」「〇〇を触られたりしていない？」と尋ねたり、こどもが「触られた」と言っていないのに「どこを触られた」「いつ触られた」と尋ねたりするなど、誘導するような問いかけをすることが「記憶の汚染」につながる。そのため、こどもが自発的に話す内容以上を聴き取ろうとしてはいけない。また、こどもが使った言葉だけを使うようにし、「当たった」と言ったのを「触られたんだね」と言い換えたり、「それはいやだったね」「怖いことをされたんだね」と、こどもが使っていない言葉でコメントしたりしてはいけない。","s":"安全確保措置２．初期対応","a":"○","e":""},{"n":33,"q":"性暴力を打ち明けられた際、基本的には、被害者には非がないと伝えることが大切だが、もし、こどもが自分を責めている様子が見られたときには、こどもにも反省すべき点があったか一緒に考える。また聴き取りの最後には「話してくれてありがとう」と伝える。","s":"安全確保措置２．初期対応","a":"×","e":"性暴力を打ち明けられた際、どのような場合であっても、被害者には非がないと伝えることが大切であり、もし、こどもが自分を責めている様子が見られたときには、「あなたは悪くない」「あなたに落ち度も責任もない」と伝える。また、聴き取りの最後には「話してくれてありがとう」と伝える。"},{"n":34,"q":"聴き取りの内容は正確に記録に残すことが重要である。可能であれば、本人の同意のもと、本人に負担感がないか十分に確認した上で、録音することも検討する。録音が難しい場合、可能であれば筆記役の同席を求め、こどもや聴き取りを行った人が何と言ったか、使った表現や言葉をそのまま記録に残す。","s":"安全確保措置２．初期対応","a":"○","e":""},{"n":35,"q":"こどもから聴き取った内容について、組織内、家族や関係機関に情報共有することについて、こども本人に伝えるが、「誰にも言わないで」と言われたら秘密は守ると約束する。","s":"安全確保措置２．初期対応","a":"×","e":"こどもから聴き取った内容について組織内、家族や関係機関に情報共有することについて、こども本人に伝える。「誰にも言わないで」と言われたら、あなたを守るために、チームで対応する必要があり、秘密にはしておけないことを丁寧に説明し、何が不安なのかについて聴き取って、不安を解消できる方法を一緒に考える。"},{"n":36,"q":"性暴力を認識した場合にはそれが疑いの段階であっても重く受け止め、聴き取った事実関係を正確に記録に起こすが、管理者への報告を急ぐ必要はない。","s":"安全確保措置２．初期対応","a":"×","e":"性暴力を認識した場合には、それが疑いの段階であっても重く受け止め、聴き取った事実関係を正確に記録に起こし、可能な限り早急に、遅くともその日のうちに管理者に報告し、対応について相談する。"},{"n":37,"q":"性暴力の疑いが生じた場合、被害にあったこどもと加害が疑われる従事者の接触回避は、事実の確認が取れた後に行えばよい。","s":"安全確保措置３．組織的な対応","a":"×","e":"性暴力の疑いが生じた場合、事実の確認がとれるまでの間を含めて、被害にあったこどもと、加害が疑われる従事者が接触しないようにすることは、こどもの安全確保のために非常に重要である。"},{"n":38,"q":"こども性暴力防止法では、従事者による性暴力の疑いを認めるとき、その事実の有無と内容について調査を行うことが事業者に義務付けられている。","s":"安全確保措置３．組織的な対応","a":"○","e":""},{"n":39,"q":"性暴力の被害が疑われる場合は、まずは事業者内のみで事実確認を行い、その結果を踏まえて、警察への通報や相談を行う。","s":"安全確保措置３．組織的な対応","a":"×","e":"性暴力の被害が疑われる場合、犯罪が疑われる場合は、こどもへの聴き取りは必要最小限にとどめ、速やかに警察に通報や相談を行う。判断に迷う場合にも、そうした状況にあることを含めて、警察に相談することを第一に検討する。"},{"n":40,"q":"こども性暴力防止法では、従事者による性暴力が行われたと認めるとき、被害を受けたこどもの保護・支援のための措置を行うことを事業者に義務付けている。","s":"安全確保措置３．組織的な対応","a":"○","e":""},{"n":41,"q":"こどものプライバシーを保護し、二次被害を防止するため、他のこどもや保護者に対して一定の説明が必要な場合であっても、うわさが発生したり、うわさが拡がったりしないように対策を講じることが必要である。","s":"安全確保措置３．組織的な対応","a":"○","e":""},{"n":42,"q":"犯罪事実確認とは、事業者が対象となる従事者の性犯罪歴の有無について、こども家庭庁を通じて確認することをいう。こども家庭庁が交付する犯罪事実確認書の申請手続は、事業者において行うので、従事者がしなければならない手続は無い。","s":"犯罪事実確認","a":"×","e":"犯罪事実確認とは、性暴力の防止のため、事業者が対象となる従事者の性犯罪歴について、こども家庭庁を通じて確認する取組を指し、こどもと接する業務に従事する全ての従事者が対象となる。申請に当たっては、事業者からこども家庭庁へ申請手続きを行うが、従事者もこれまでのすべての戸籍・除籍の提出が必要である。"},{"n":43,"q":"犯罪事実確認の手続は、原則として、新たにこども性暴力防止法の施行のために開発されるこまもろうシステム上で行う。","s":"犯罪事実確認","a":"○","e":""},{"n":44,"q":"従事者から戸籍が提出されず、犯罪事実確認が行えない場合には、その従事者はこどもと接する業務に就くことができない。","s":"犯罪事実確認","a":"○","e":""},{"n":45,"q":"新規採用・異動などにより新たに対象業務に従事する場合は、従事開始前に犯罪事実確認を終えておく必要がある。","s":"犯罪事実確認","a":"○","e":""},{"n":46,"q":"義務対象事業者において、法施行時に対象業務に従事・内定している人については、施行の日から3年以内に犯罪事実確認を行うことが必要である。認定事業者において、認定時に対象業務に従事・内定している人については、認定の日から1年以内に犯罪事実確認を行うことが必要である。","s":"犯罪事実確認","a":"○","e":""},{"n":47,"q":"従事者が対象業務に継続して従事している場合、一度犯罪事実確認を行っていれば、従事期間にかかわらず再度確認をする必要はない。","s":"犯罪事実確認","a":"×","e":"犯罪事実確認を行った従事者が対象業務に継続して従事している場合、5年ごとに改めて犯罪事実確認を実施することが必要である。"},{"n":48,"q":"「いとま特例」が適用され、犯罪事実確認前に従事する場合は、原則として、こどもと一対一にならないことが必要である。","s":"犯罪事実確認","a":"○","e":""},{"n":49,"q":"性犯罪歴があると認められる場合、事業者に犯罪事実確認書を交付する前に従事者に通知が行われる。誤って性犯罪歴ありとされている場合は、通知を受けた日から２週間以内に従事者本人から訂正請求をすることができる。","s":"犯罪事実確認","a":"○","e":""},{"n":50,"q":"防止措置とは、事業者が、従事者によって性暴力が行われるおそれがあると認めるときに、その従事者をこどもと接する業務に就かせないなど、性暴力を防止するために講じなければならない措置をいう。","s":"防止措置","a":"○","e":""},{"n":51,"q":"こどもやその保護者から被害の申出があった場合もまずは調査を行い、その後にこどもと加害が疑われる従事者の接触回避を行う。","s":"防止措置","a":"×","e":"こどもや保護者から被害の申出があった場合は、調査などの前に、「おそれ」ありと判断し、まずこどもと加害が疑われる従事者の接触回避を行う。"},{"n":52,"q":"犯罪事実確認の結果、性犯罪歴があったとき、調査などの結果、性暴力や重大な不適切な行為が行われたと合理的に判断されるときには、原則としてこどもと接する業務に就くことができない。","s":"防止措置","a":"○","e":""},{"n":53,"q":"不適切な行為が行われたと合理的に判断され、それが初回かつ比較的軽微なものであるような場合、事業者は、まずはそのような行為を繰り返さないように指導を行い、研修を受講させ、注意深くその後の経過観察を行うことが考えられる。指導したにも関わらず同様の行為を繰り返す場合には、より厳格な対応（こどもと接する業務に従事させない）を行う。","s":"防止措置","a":"○","e":""},{"n":54,"q":"従事者の性犯罪歴に関する情報が漏えいした場合、深刻な人権侵害につながる可能性があるため、情報管理は決して軽視してはならず、厳格に行うことが求められる。","s":"情報管理措置","a":"○","e":""},{"n":55,"q":"こども性暴力防止法において情報管理の対象となる「性犯罪歴の記録」とは、こども家庭庁から交付される犯罪事実確認書や、犯罪事実確認書に記載された情報を転記したものを指す。","s":"情報管理措置","a":"○","e":""},{"n":56,"q":"性犯罪歴がない旨の情報も「性犯罪歴の記録」に該当せず、情報管理の対象とならない。","s":"情報管理措置","a":"×","e":"性犯罪歴がない旨の情報も「性犯罪歴の記録」に該当するため、情報管理の対象となる。"},{"n":57,"q":"事業者には、安全に性犯罪歴の記録を管理する方策や情報の漏えいなどが発生した場合の対応の手順、報告・連絡体制を定めた「情報管理規程」を策定することが求められる。","s":"情報管理措置","a":"○","e":""},{"n":58,"q":"情報漏えいの可能性に気づいた場合、組織で定められた情報管理規程に基づいた速やかな報告と対応を行う必要がある。そのため、漏えい時に、誰に、どのような手順で報告するかを知っておくことが重要である。","s":"情報管理措置","a":"○","e":""},{"n":59,"q":"性犯罪歴に関する情報を第三者に教えたり、提供したりすることは許されないが、保護者から問い合わせがあった場合、その保護者のみであれば提供することができる。","s":"情報管理措置","a":"×","e":"性犯罪歴に関する情報を第三者に教えたり、提供したりすることは許されない。職場内、保護者、親しい友人や家族に口外したり、匿名であってもSNSなどに投稿したりしてはならない。また、退職後にも情報を漏らすことは許されない。"},{"n":60,"q":"情報管理措置に関する規定に故意に違反した場合はその違反行為を行った従事者個人に、罰則が科される。また、従事者個人に対する名誉毀損などに当たり、民事上の損害賠償につながるおそれもある。","s":"情報管理措置","a":"○","e":""}];
const SECS=["こども性暴力防止法の概要", "性暴力発生防止に関する基礎", "安全確保措置１．早期発見のための取組", "安全確保措置２．初期対応", "安全確保措置３．組織的な対応", "犯罪事実確認", "防止措置", "情報管理措置"];
let st={},wrong=[];
try{wrong=JSON.parse(localStorage.getItem("kodomo_wrong")||"[]")}catch(e){}
let hist=[];
try{hist=JSON.parse(localStorage.getItem("kodomo_hist")||"[]")}catch(e){}
function saveH(){try{localStorage.setItem("kodomo_hist",JSON.stringify(hist))}catch(e){}}
function clearH(){if(confirm("点数の記録をすべて消します。よろしいですか？")){hist=[];saveH();home()}}
function histCard(){
  if(!hist.length)return"";
  const rows=hist.map((x,i)=>({x,i})).reverse().slice(0,30).map(({x,i})=>`<div class="row"><span>第${i+1}回　${esc(x.l)}<br><small style="color:var(--sub)">${x.d}</small></span><span><b>${x.ok}/${x.n}</b>（${Math.round(x.ok/x.n*100)}%）</span></div>`).join("");
  return`<div class="card"><b>点数の記録</b><div style="margin-top:8px">${rows}</div><button class="link" onclick="clearH()">記録を消す</button></div>`;
}
const $=document.getElementById("app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function save(){try{localStorage.setItem("kodomo_wrong",JSON.stringify(wrong))}catch(e){}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
  let h=`<h1>こども性暴力防止法確認テスト</h1><p class="sub">全${Q.length}問・○×形式。解説付き。</p>
  <label class="t"><input type="checkbox" id="sh"> 出題順をシャッフル</label>
  <button class="btn p" onclick="start(Q,'全問')">全${Q.length}問に挑戦</button>`;
  h+=`<div class="card"><b>部ごとに挑戦</b><div style="margin-top:10px">`;
  SECS.forEach(s=>{const n=Q.filter(q=>q.s===s).length;h+=`<button class="btn" onclick="start(Q.filter(q=>q.s==='${s}'),'${s}')">${s}<small>${n}問</small></button>`});
  h+=`</div></div>`;
  h+=`<button class="btn p" ${wrong.length?"":"disabled"} onclick="start(Q.filter(q=>wrong.includes(q.n)),'復習')">間違えた問題を復習（${wrong.length}問）</button>`;
  h+=histCard();
  $.innerHTML=h;
}
function start(list,label){
  if(!list.length)return;
  const sh=document.getElementById("sh");
  st={label:label,list:(sh&&sh.checked)?shuf(list):list,i:0,ok:0,ng:[],done:false};
  show();
}
function show(){
  const q=st.list[st.i],p=st.i/st.list.length*100;
  $.innerHTML=`<div class="meta"><span>${esc(q.s)}</span><span>${st.i+1} / ${st.list.length}</span></div><div class="bar"><i style="width:${p}%"></i></div>
  <div class="card"><div class="meta">問題 ${q.n}</div><p class="q">${esc(q.q)}</p>
  <div class="ans"><button class="o" onclick="pick('○')">○</button><button class="x" onclick="pick('×')">×</button></div><div id="r"></div></div>`;
}
function pick(a){
  const q=st.list[st.i],c=a===q.a;
  if(c){st.ok++;wrong=wrong.filter(n=>n!==q.n)}else{st.ng.push(q);if(!wrong.includes(q.n))wrong.push(q.n)}
  save();
  document.querySelectorAll(".ans button").forEach(b=>b.disabled=true);
  const last=st.i===st.list.length-1;
  document.getElementById("r").innerHTML=`<div class="res ${c?"ok":"ng"}"><b>${c?"正解！":"不正解"}　正答：${q.a}</b>${q.e?`<p>${esc(q.e)}</p>`:""}</div>
  <button class="btn p" style="margin-top:14px" onclick="next()">${last?"結果を見る":"次の問題へ"}</button>`;
}
function next(){st.i++;st.i>=st.list.length?result():show()}
function result(){
  const n=st.list.length,pct=Math.round(st.ok/n*100);
  if(!st.done){st.done=true;const t=new Date(),p=v=>String(v).padStart(2,"0");
    hist.push({d:`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${p(t.getHours())}:${p(t.getMinutes())}`,l:st.label||"",ok:st.ok,n:n});saveH();}
  let h=`<h1>結果（第${hist.length}回）</h1><div class="card"><div class="score">${st.ok} / ${n}</div><p class="sub" style="text-align:center">正答率 ${pct}%　${pct===100?"全問正解！":pct>=80?"よくできました":"解説を見直してみましょう"}</p></div>`;
  const by={};st.list.forEach(q=>{by[q.s]=by[q.s]||[0,0];by[q.s][1]++});
  st.list.forEach(q=>{if(!st.ng.includes(q))by[q.s][0]++});
  h+=`<div class="card"><b>部ごとの結果</b>`+Object.entries(by).map(([s,v])=>`<div class="row"><span>${esc(s)}</span><span>${v[0]}/${v[1]}</span></div>`).join("")+`</div>`;
  if(st.ng.length){h+=`<div class="card"><b>間違えた問題</b>`+st.ng.map(q=>`<div class="wr"><b>問${q.n}（正答 ${q.a}）</b><br>${esc(q.q)}${q.e?`<br><span style="color:var(--sub)">${esc(q.e)}</span>`:""}</div>`).join("")+`</div>
  <button class="btn p" onclick="start(st.ng,'間違い再挑戦')">間違えた問題をもう一度</button>`}
  h+=histCard();
  h+=`<button class="btn" onclick="home()" style="text-align:center">トップに戻る</button>`;
  $.innerHTML=h;scrollTo(0,0);
}
home();
</script></body></html>
